name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只跑不需要真机的那部分。
# 安装到 TCL 电视 / Pico 依赖内网设备,不可能在 CI 上跑 ——
# 那部分靠本地的 tools/verify-all.sh。
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub 的 ubuntu runner 自带 Android SDK,ANDROID_HOME 已设好,
      # 所以不需要 local.properties(它本来也不入库)。
      - name: 环境自检
        run: bash tools/verify-all.sh --build-only

      # 可选:配了 secret 就还原签名凭据,下面的 assembleRelease 会产出**已签名**的正式包。
      # 没配就跳过 —— 那样 assembleRelease 只当作编译检查(产出 unsigned 包,装不上设备)。
      #
      # 配置方法(一次性):
      #   1. 本机 bash tools/gen-keystore.sh --export   → 得到一个凭据包文件
      #   2. 把该文件的**全部内容**存进 repo secret: Settings → Secrets → Actions →
      #      New repository secret,名字 KEYSTORE_B64
      #   凭据包内含密钥库与密码 —— 等同私钥。GitHub 会自动在日志里打码显示。
      - name: 还原签名凭据(可选)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::未配置 KEYSTORE_B64 —— 跳过,assembleRelease 将产出 unsigned 包"
            exit 0
          fi
          # secret 里存的就是 --export 产物的全文(带 # 头部注释),--import 自己能剥掉
          printf '%s\n' "$KEYSTORE_B64" > /tmp/signing-bundle.b64
          bash tools/gen-keystore.sh --import /tmp/signing-bundle.b64
          rm -f /tmp/signing-bundle.b64

      - name: 构建 + lint + 单测
        working-directory: apps/DualDemo
        run: |
          ./gradlew assembleDebug assembleRelease lint testDebugUnitTest \
            --no-daemon --console=plain --max-workers=2

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: DualDemo-apk
          path: apps/DualDemo/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 上传 JVM 截图(Robolectric + Roborazzi 渲染出来的界面)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: apps/DualDemo/app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore

      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: apps/DualDemo/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
