name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只跑不需要真机的那部分。
# 安装到 TCL 电视 / Pico 依赖内网设备,不可能在 CI 上跑 ——
# 那部分靠本地的 tools/verify-all.sh。
jobs:
  build:
    # ⚠️ 明确 pin 版本,不用 `ubuntu-latest`。
    #
    # 2026-10-19 起 `-latest` 会迁到 Ubuntu 26.04(runner-images#14748)。而这个仓库
    # 的 CI 不只是"跑个编译" —— verify-all 会去查 `$ANDROID_HOME` 下的工具链,
    # 换 OS 是**会动构建环境**的事,不该跟着 `-latest` 无声发生。
    #
    # 两镜像的 Android SDK 现已比对过(actions/runner-images 的 images/ubuntu/*-Readme.md):
    # 我们真正需要的都在 —— build-tools 34.0.0、platform android-34、platform-tools 37.0.1。
    # 唯一差别是 **cmdline-tools 12.0 → 20.0**,而 verify-all 正会检查它。
    # 所以升 26.04 请单独开一次、先在 CI 上验过再合,别混在功能开发里。
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # action 主版本原先都停在 Node 20 上。Node 20 随 runner 升级移除
      # (GitHub changelog 2025-09-19),这几个 action 被强制跑在 Node 24,
      # 每次 CI 都刷一条 warning。升到跑 Node 24 的主版本即可。
      #
      # 逐条比对过 major 之间的变更,均不涉及本仓库用到的输入:
      #   checkout        v5=Node24  v6=凭据持久化到单独文件  v7=ESM + 拦 fork PR(我们不用)
      #   setup-java      v5=Node24  v6=ESM(官方声明非用户可见的破坏性变更)
      #   upload-artifact v5=Node24  v6=默认 Node24          v7=新增 archive 开关(默认仍是旧行为)
      - uses: actions/checkout@v7
        with:
          # 提交信息规范校验要回溯到上一个 tag;浅克隆会让它看不到。
          # (fetch-depth: 0 在这个仓库也就几 MB,不必省)
          fetch-depth: 0

      # 放在最前面:版本号是**从提交信息机械推导**的(release.sh),
      # 不规范的提交会让推导失准。让它在 CI 里当场报错,而不是等发版时才发现。
      # 只看**这次推送**的提交,不翻旧账。
      - name: 提交信息规范(Conventional Commits)
        if: github.event_name == 'push'
        run: |
          bash tools/release.sh --check-commits \
            "${{ github.event.before }}..${{ github.sha }}"

      - name: 装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub 的 ubuntu runner 自带 Android SDK,ANDROID_HOME 已设好,
      # 所以不需要 local.properties(它本来也不入库)。
      - name: 环境自检
        run: bash tools/verify-all.sh --build-only

      # 可选:配了 secret 就还原签名凭据,下面的 assembleRelease 会产出**已签名**的正式包。
      # 没配就跳过 —— 那样 assembleRelease 只当作编译检查(产出 unsigned 包,装不上设备)。
      #
      # 配置方法(一次性):
      #   bash tools/gen-keystore.sh --push-secret
      #     —— 从本机直接推成下面的 secret。也可手工建:
      #        Settings → Secrets → Actions → New repository secret
      #        名字 KEYSTORE_B64,值 = gen-keystore.sh --export 产物的全部内容
      #   必须从**已认证的本机**做 —— GitHub 不允许 CI 给自己创建 secret(那是提权)。
      # ⚠️ 用**同一把**密钥,不要在 CI 上重新生成(= 换签名,老用户升不了级)。
      #    凭据包内含密钥库与密码,等同私钥。GitHub 会自动在日志里打码显示。
      - name: 还原签名凭据(可选)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::未配置 KEYSTORE_B64 —— 跳过,assembleRelease 将产出 unsigned 包"
            exit 0
          fi
          # secret 里存的就是 --export 产物的全文(带 # 头部注释),--import 自己能剥掉
          printf '%s\n' "$KEYSTORE_B64" > /tmp/signing-bundle.b64
          bash tools/gen-keystore.sh --import /tmp/signing-bundle.b64
          rm -f /tmp/signing-bundle.b64

      - name: 构建 + lint + 单测
        working-directory: apps/DualDemo
        run: |
          ./gradlew assembleDebug assembleRelease lint testDebugUnitTest \
            --no-daemon --console=plain --max-workers=2

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: DualDemo-apk
          path: apps/DualDemo/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 上传 JVM 截图(Robolectric + Roborazzi 渲染出来的界面)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: apps/DualDemo/app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore

      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: apps/DualDemo/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
