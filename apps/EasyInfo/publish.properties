# 这个应用发到哪些渠道
#
#   github = GitHub Release 附件(不审查;适合开发版/测试包)
#   play   = Google Play(AAB;需要 Play Console 账号 + Play App Signing)
#   cn     = 国内应用商店(APK;TCL / 华为 / 小米 / OPPO / vivo 等后台人工上传)
#
# 多个渠道用逗号分隔。缺省(没有这个文件)= github。
# tools/release-apk.sh 和 tools/store-preflight.sh 都读这一行。
targets=github,play,cn

# 上传用的签名别名。缺省 = 工程目录名(EasyInfo)。
# 对应 keystore.properties 里的 alias.EasyInfo=...
# ⚠️ 首次上架后不能改 —— 等于换签名。
alias=EasyInfo
