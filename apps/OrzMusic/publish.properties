# 这个应用发到哪些渠道
#
#   github = GitHub Release 附件(不审查)
#   play   = Google Play(AAB + Play App Signing)
#   cn     = 国内应用商店(APK;TCL / 华为 / 小米 / OPPO / vivo)
#
# 多个渠道用逗号分隔。缺省(没有这个文件)= github。
targets=github,play,cn

# 上传用的签名别名。缺省 = 工程目录名(OrzMusic)。
# 对应 keystore.properties 里的 alias.OrzMusic=...
# ⚠️ 首次上架后不能改 —— 等于换签名。
alias=OrzMusic
