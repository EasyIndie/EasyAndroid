# ─────────────────────────────────────────────────────────────
# 版本号唯一来源
#
# 仓库里不应该再出现版本号字面量。各工程的 versionName / versionCode,
# 以及界面上显示的版本,都从这里推导:
#   · versionName = version
#   · versionCode = MAJOR*10000 + MINOR*100 + PATCH
# 约定和理由见 docs/06-app-conventions.md#版本号。
#
# 格式:严格 SemVer —— 只允许 MAJOR.MINOR.PATCH。
#   不要写 -alpha.1 / +build.7 这类后缀:versionCode 由本值推导,
#   带后缀会让两个不同的版本算出同一个 versionCode,装上去无法覆盖升级。
#   预发布阶段就直接涨 MINOR / PATCH。
#
# 版本历史
#   0.0.1  仓库的第一个版本  (git tag 0.0.1)
#   0.1.0  脚本跨平台化:Windows 原生(Git Bash)/ WSL2 / Linux 都能跑  (git tag 0.1.0)
#           feat -> MINOR
#
# 改完之后要做的两件事
#   1. bash tools/verify-all.sh     # 会校验 APK 里的 versionName 与这里一致
#   2. git tag <version> && git push origin <version>
#      tag 名 == 这里的 version,不加 v 前缀(和已有的 0.0.1 保持一致)
# ─────────────────────────────────────────────────────────────
version=0.1.0
